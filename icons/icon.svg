<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2b4f"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf8f"/>
      <stop offset="0.6" stop-color="#35d0a5"/>
      <stop offset="1" stop-color="#7ee0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="88" y="88" width="848" height="848" rx="200" fill="url(#tile)"/>
  <rect x="88" y="88" width="848" height="848" rx="200" fill="url(#glow)"/>
  <rect x="89.5" y="89.5" width="845" height="845" rx="198.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- dial track (half ring, opening downward) -->
  <path d="M262 596 A 250 250 0 0 1 762 596" fill="none"
        stroke="#ffffff" stroke-opacity="0.13" stroke-width="96" stroke-linecap="round"/>

  <!-- consumed portion (62% of the scale) -->
  <path d="M262 596 A 250 250 0 0 1 604 364" fill="none"
        stroke="url(#arc)" stroke-width="96" stroke-linecap="round"/>

  <!-- needle + hub -->
  <path d="M512 596 L586 410" fill="none" stroke="#eaf1ff" stroke-width="52" stroke-linecap="round"/>
  <circle cx="512" cy="596" r="74" fill="#0c1220"/>
  <circle cx="512" cy="596" r="46" fill="#eaf1ff"/>

  <!-- scale ticks -->
  <path d="M262 700 L262 660" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="26" stroke-linecap="round"/>
  <path d="M762 700 L762 660" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="26" stroke-linecap="round"/>
</svg>
