name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag (e.g. v0.1.0, required if release is checked)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────── Windows ──────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Windows installer
        run: bunx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ────────────── macOS ──────────────
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: macos-x64
          - target: aarch64-apple-darwin
            artifact: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Generate platform icons
        run: bunx tauri icon icons/icon.png

      - name: Build macOS bundle
        run: bunx tauri build --target ${{ matrix.target }} --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # ────────────── Linux ──────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            artifact: linux-x86_64
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            artifact: linux-aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Linux bundles
        run: bunx tauri build --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # ────────────── 正式 Release（tag 触发） ──────────────
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release == true)
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: artifacts/macos-x64

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: artifacts/linux-aarch64

      - name: Show release files
        run: find artifacts -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Usage Monitor ${{ steps.tag.outputs.tag }}"
          files: |
            artifacts/windows/**/*.exe
            artifacts/macos-x64/**/*.dmg
            artifacts/macos-arm64/**/*.dmg
            artifacts/linux-x86_64/**/*.AppImage
            artifacts/linux-x86_64/**/*.deb
            artifacts/linux-aarch64/**/*.AppImage
            artifacts/linux-aarch64/**/*.deb
          draft: false
          generate_release_notes: true

  # ────────────── CI Latest Build（main 分支 push 触发） ──────────────
  latest:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: artifacts/macos-x64

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: artifacts/linux-aarch64

      # 这个 job 没有 checkout，`gh` 找不到 git 仓库会失败（被 || true 吞掉）：
      # 显式给 GH_REPO，并用 API 删 tag（都不依赖本地 git）。
      - name: Delete old latest release
        run: |
          gh release delete latest --yes || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Usage Monitor (latest CI build)"
          files: |
            artifacts/windows/**/*.exe
            artifacts/macos-x64/**/*.dmg
            artifacts/macos-arm64/**/*.dmg
            artifacts/linux-x86_64/**/*.AppImage
            artifacts/linux-x86_64/**/*.deb
            artifacts/linux-aarch64/**/*.AppImage
            artifacts/linux-aarch64/**/*.deb
          draft: false
          prerelease: true
          body: |
            自动构建于 ${{ github.sha }} — 始终指向 main 分支最新提交。
            正式版本请查看 [Releases](https://github.com/icehomura/usage-monitor/releases) 页面。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
